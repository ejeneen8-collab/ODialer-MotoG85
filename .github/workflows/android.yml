                                                          ) { Text(digit, fontSize = 22.sp, color = Color.White) }
                                                      }
                                                  }
                                                  Spacer(Modifier.height(8.dp))
                                              }
                                          } else {
                                              val speakerOn = route == CallAudioState.ROUTE_SPEAKER
                                              val bluetoothOn = route == CallAudioState.ROUTE_BLUETOOTH
                                              Row(
                                                  modifier = Modifier.fillMaxWidth(),
                                                  horizontalArrangement = Arrangement.SpaceEvenly
                                              ) {
                                                  ControlButton("Mute", muted, routes != 0) {
                                                      CallStore.toggleMute()
                                                  }
                                                  ControlButton("Keypad", false, true) {
                                                      keypadVisible = true
                                                  }
                                                  ControlButton("Speaker", speakerOn, true) {
                                                      CallStore.setRoute(
                                                          if (speakerOn) CallAudioState.ROUTE_EARPIECE
                                                          else CallAudioState.ROUTE_SPEAKER
                                                      )
                                                  }
                                              }
                                              Spacer(Modifier.height(20.dp))
                                              Row(
                                                  modifier = Modifier.fillMaxWidth(),
                                                  horizontalArrangement = Arrangement.SpaceEvenly
                                              ) {
                                                  ControlButton("Bluetooth", bluetoothOn,
                                                      (routes and CallAudioState.ROUTE_BLUETOOTH) != 0) {
                                                      CallStore.setRoute(
                                                          if (bluetoothOn) CallAudioState.ROUTE_EARPIECE
                                                          else CallAudioState.ROUTE_BLUETOOTH
                                                      )
                                                  }
                                                  val canHold = call?.details?.let {
                                                      (it.callCapabilities and Call.Details.CAPABILITY_SUPPORT_HOLD) != 0
                                                  } == true
                                                  ControlButton(
                                                      if (holding) "Resume" else "Hold",
                                                      holding, canHold
                                                  ) {
                                                      if (holding) call?.unhold() else call?.hold()
                                                  }
                                                  ControlButton("Add call", false, true) {
                                                      try {
                                                          startActivity(Intent(Intent.ACTION_DIAL))
                                                      } catch (_: Exception) {
                                                          startActivity(Intent(Intent.ACTION_DIAL))
                                                      }
                                                  }
                                              }
                                              Spacer(Modifier.height(18.dp))
                                              Row(
                                                  modifier = Modifier.fillMaxWidth(),
                                                  horizontalArrangement = Arrangement.SpaceEvenly
                                              ) {
