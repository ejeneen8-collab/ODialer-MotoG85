                                          fontWeight = FontWeight.Bold)
                                      Spacer(Modifier.height(30.dp))
                                      Box(
                                          modifier = Modifier.size(104.dp).background(
                                              Color(0xFF263B59), CircleShape
                                          ),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Text(
                                              (contactName.ifBlank { number.ifBlank { "?" } })
                                                  .take(1).uppercase(Locale.getDefault()),
                                              color = Color.White, fontSize = 42.sp,
                                              fontWeight = FontWeight.Bold
                                          )
                                      }
                                      Spacer(Modifier.height(18.dp))
                                      Text(contactName.ifBlank { "Unknown caller" },
                                          color = Color.White, fontSize = 25.sp,
                                          fontWeight = FontWeight.SemiBold,
                                          textAlign = TextAlign.Center)
                                      Text(number, color = Color(0xFFB9C7D9), fontSize = 17.sp)
                                      Spacer(Modifier.height(10.dp))
                                      Text(
                                          when {
                                              incoming -> "Incoming call"
                                              call?.state == Call.STATE_DIALING -> "Calling…"
                                              call?.state == Call.STATE_CONNECTING -> "Connecting…"
                                              active -> "Connected  •  ${formatDuration(elapsed)}"
                                              holding -> "On hold"
                                              call == null -> "Call ended"
                                              else -> "Call"
                                          },
                                          color = Color(0xFFB9C7D9), fontSize = 15.sp
                                      )
                                      val account = call?.details?.accountHandle?.id.orEmpty()
                                      if (account.isNotBlank()) {
                                          Text("SIM: $account", color = Color(0xFF91A4BD), fontSize = 12.sp)
                                      }
                                  }

                                  if (incoming) {
                                      Row(
                                          modifier = Modifier.fillMaxWidth(),
                                          horizontalArrangement = Arrangement.SpaceEvenly,
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
