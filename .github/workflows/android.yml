
name: Build ODialer Moto G85

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses and install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Extract Android project
        run: |
          mkdir -p /tmp/odialer-src
          unzip -q ODialer-MotoG85-starter.zip -d /tmp/odialer-src
          cp -a /tmp/odialer-src/ODialer-MotoG85/. .

      - name: Create new Dialer interface
        run: |
          cat > app/src/main/java/com/motog85/odialer/MainActivity.kt <<'EOF'
          package com.motog85.odialer

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.ContactsContract
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContent {
                      var number by remember { mutableStateOf("") }

                      val keys = listOf(
                          listOf("1" to "", "2" to "ABC", "3" to "DEF"),
                          listOf("4" to "GHI", "5" to "JKL", "6" to "MNO"),
                          listOf("7" to "PQRS", "8" to "TUV", "9" to "WXYZ"),
                          listOf("*" to "", "0" to "+", "#" to "")
                      )

                      val lightGray = Color(0xFFF1F1F1)
                      val green = Color(0xFF00C967)

                      MaterialTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = Color.White
                          ) {
                              Column(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .padding(horizontal = 22.dp)
                              ) {
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .padding(top = 24.dp),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      CircleAction("‹", lightGray) {
                                          number = ""
                                      }

                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          CircleAction("⌕", lightGray) {
                                              try {
                                                  startActivity(
                                                      Intent(
                                                          Intent.ACTION_VIEW,
                                                          ContactsContract.Contacts.CONTENT_URI
                                                      )
                                                  )
                                              } catch (_: Exception) {}
                                          }

                                          Spacer(Modifier.width(12.dp))

                                          CircleAction("▦", lightGray) {
                                              number = ""
                                          }
                                      }
                                  }

                                  Box(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .weight(1f),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Text(
                                          text = number.ifEmpty { "" },
                                          fontSize = 30.sp,
                                          color = Color.Black,
                                          fontWeight = FontWeight.Medium,
                                          textAlign = TextAlign.Center
                                      )
                                  }

                                  Column(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalAlignment = Alignment.CenterHorizontally
                                  ) {
                                      keys.forEach { row ->
                                          Row(
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .padding(vertical = 8.dp),
                                              horizontalArrangement =
                                                  Arrangement.SpaceEvenly
                                          ) {
                                              row.forEach { item ->
                                                  Column(
                                                      modifier = Modifier
                                                          .size(92.dp)
                                                          .clip(CircleShape)
                                                          .background(lightGray)
                                                          .clickable {
                                                              number += item.first
                                                          },
                                                      horizontalAlignment =
                                                          Alignment.CenterHorizontally,
                                                      verticalArrangement =
                                                          Arrangement.Center
                                                  ) {
                                                      Text(
                                                          item.first,
                                                          fontSize = 38.sp,
                                                          color = Color.Black,
                                                          fontWeight = FontWeight.Medium
                                                      )

                                                      if (item.second.isNotEmpty()) {
                                                          Text(
                                                              item.second,
                                                              fontSize = 15.sp,
                                                              color = Color.DarkGray,
                                                              fontWeight = FontWeight.Bold
                                                          )
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  }

                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .padding(top = 12.dp, bottom = 30.dp),
                                      horizontalArrangement =
                                          Arrangement.SpaceEvenly,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      BottomAction("WhatsApp") {
                                          if (number.isNotBlank()) {
                                              try {
                                                  startActivity(
                                                      Intent(
                                                          Intent.ACTION_VIEW,
                                                          Uri.parse("https://wa.me/$number")
                                                      )
                                                  )
                                              } catch (_: Exception) {}
                                          }
                                      }

                                      Box(
                                          modifier = Modifier
                                              .size(112.dp)
                                              .clip(CircleShape)
                                              .background(green)
                                              .clickable {
                                                  if (number.isNotBlank()) {
                                                      startActivity(
                                                          Intent(
                                                              Intent.ACTION_DIAL,
                                                              Uri.parse("tel:$number")
                                                          )
                                                      )
                                                  }
                                              },
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Column(
                                              horizontalAlignment =
                                                  Alignment.CenterHorizontally
                                          ) {
                                              Text(
                                                  "☎",
                                                  color = Color.White,
                                                  fontSize = 42.sp
                                              )
                                              Text(
                                                  "SIM 1",
                                                  color = Color.White,
                                                  fontSize = 12.sp,
                                                  fontWeight = FontWeight.Bold
                                              )
                                          }
                                      }

                                      BottomAction("⌫") {
                                          if (number.isNotEmpty()) {
                                              number = number.dropLast(1)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun CircleAction(
              symbol: String,
              color: Color,
              onClick: () -> Unit
          ) {
              Box(
                  modifier = Modifier
                      .size(56.dp)
                      .clip(CircleShape)
                      .background(color)
                      .clickable { onClick() },
                  contentAlignment = Alignment.Center
              ) {
                  Text(
                      symbol,
                      fontSize = 30.sp,
                      color = Color.DarkGray
                  )
              }
          }

          @Composable
          fun BottomAction(
              label: String,
              onClick: () -> Unit
          ) {
              Box(
                  modifier = Modifier
                      .size(64.dp)
                      .clip(CircleShape)
                      .clickable { onClick() },
                  contentAlignment = Alignment.Center
              ) {
                  Text(
                      label,
                      fontSize = if (label == "⌫") 32.sp else 14.sp,
                      color = Color.Black,
                      fontWeight = FontWeight.Bold,
                      textAlign = TextAlign.Center
                  )
              }
          }
          EOF

      - name: Set Java and Kotlin target to 17
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ODialer-MotoG85-APK
          path: app/build/outputs/apk/debug/app-debug.apk
