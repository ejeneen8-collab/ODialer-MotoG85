
name: Build ODialer Moto G85

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Extract Android project
        run: |
          mkdir -p /tmp/odialer-src
          unzip -q ODialer-MotoG85-starter.zip -d /tmp/odialer-src
          cp -a /tmp/odialer-src/ODialer-MotoG85/. .

      - name: Install app icon resources
        run: |
          if [ -f ODialer-permanent-icon-resources.zip ]; then
            mkdir -p /tmp/odialer-icon
            unzip -q ODialer-permanent-icon-resources.zip -d /tmp/odialer-icon
            if [ -d /tmp/odialer-icon/app/src/main/res ]; then
              cp -a /tmp/odialer-icon/app/src/main/res/. app/src/main/res/
            fi
          fi

      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"

          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")

          if app is None:
              raise SystemExit("ERROR: Application tag not found")

          app.set(ns + "label", "ODialer Moto G85")

          if os.path.exists("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml") or \
             os.path.exists("app/src/main/res/mipmap-hdpi/ic_launcher.png") or \
             os.path.exists("app/src/main/res/mipmap/ic_launcher.xml"):
              app.set(ns + "icon", "@mipmap/ic_launcher")

          permissions = [
              "android.permission.READ_CONTACTS",
              "android.permission.READ_CALL_LOG",
              "android.permission.CALL_PHONE",
              "android.permission.READ_PHONE_STATE"
          ]

          for permission in permissions:
              found = any(
                  item.get(ns + "name") == permission
                  for item in root.findall("uses-permission")
              )
              if not found:
                  ET.SubElement(
                      root,
                      "uses-permission",
                      {ns + "name": permission}
                  )

          main = None
          for activity in app.findall("activity"):
              if activity.get(ns + "name", "").endswith("MainActivity"):
                  main = activity
                  break

          if main is None:
              main = ET.SubElement(
                  app,
                  "activity",
                  {ns + "name": ".MainActivity"}
              )

          main.set(ns + "exported", "true")

          def has_filter(activity, action, category=None, scheme=None):
              for item in activity.findall("intent-filter"):
                  actions = [
                      x.get(ns + "name")
                      for x in item.findall("action")
                  ]
                  categories = [
                      x.get(ns + "name")
                      for x in item.findall("category")
                  ]
                  data_items = item.findall("data")

                  if action not in actions:
                      continue
                  if category and category not in categories:
                      continue
                  if scheme:
                      if not any(
                          x.get(ns + "scheme") == scheme
                          for x in data_items
                      ):
                          continue
                  return True
              return False

          if not has_filter(
              main,
              "android.intent.action.MAIN",
              "android.intent.category.LAUNCHER"
          ):
              f = ET.SubElement(main, "intent-filter")
              ET.SubElement(f, "action", {
                  ns + "name": "android.intent.action.MAIN"
              })
              ET.SubElement(f, "category", {
                  ns + "name": "android.intent.category.LAUNCHER"
              })

          if not has_filter(
              main,
              "android.intent.action.DIAL",
              "android.intent.category.DEFAULT"
          ):
              f = ET.SubElement(main, "intent-filter")
              ET.SubElement(f, "action", {
                  ns + "name": "android.intent.action.DIAL"
              })
              ET.SubElement(f, "category", {
                  ns + "name": "android.intent.category.DEFAULT"
              })

          if not has_filter(
              main,
              "android.intent.action.DIAL",
              "android.intent.category.DEFAULT",
              "tel"
          ):
              f = ET.SubElement(main, "intent-filter")
              ET.SubElement(f, "action", {
                  ns + "name": "android.intent.action.DIAL"
              })
              ET.SubElement(f, "category", {
                  ns + "name": "android.intent.category.DEFAULT"
              })
              ET.SubElement(f, "data", {
                  ns + "scheme": "tel"
              })

          call_activity = None
          for activity in app.findall("activity"):
              if activity.get(ns + "name") == ".CallActivity":
                  call_activity = activity
                  break

          if call_activity is None:
              call_activity = ET.SubElement(
                  app,
                  "activity",
                  {
                      ns + "name": ".CallActivity",
                      ns + "exported": "false"
                  }
              )

          service = None
          for item in app.findall("service"):
              if item.get(ns + "name", "").endswith("PhoneInCallService"):
                  service = item
                  break

          if service is None:
              service = ET.SubElement(
                  app,
                  "service",
                  {ns + "name": ".PhoneInCallService"}
              )

          service.set(
              ns + "permission",
              "android.permission.BIND_INCALL_SERVICE"
          )
          service.set(ns + "exported", "true")

          if not any(
              any(
                  a.get(ns + "name") == "android.telecom.InCallService"
                  for a in f.findall("action")
              )
              for f in service.findall("intent-filter")
          ):
              f = ET.SubElement(service, "intent-filter")
              ET.SubElement(f, "action", {
                  ns + "name": "android.telecom.InCallService"
              })

          metadata = None
          for item in service.findall("meta-data"):
              if item.get(ns + "name") == "android.telecom.IN_CALL_SERVICE_UI":
                  metadata = item
                  break

          if metadata is None:
              metadata = ET.SubElement(service, "meta-data")

          metadata.set(
              ns + "name",
              "android.telecom.IN_CALL_SERVICE_UI"
          )
          metadata.set(ns + "value", "true")

          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("Manifest configured successfully")
          PY

      - name: Create Main Dialer
        run: |
          mkdir -p app/src/main/java/com/motog85/odialer
          cat > app/src/main/java/com/motog85/odialer/MainActivity.kt <<'EOF'
          package com.motog85.odialer

          import android.Manifest
          import android.app.role.RoleManager
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.CallLog
          import android.provider.ContactsContract
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          data class RecentCall(
              val name: String,
              val number: String,
              val type: String,
              val date: String
          )

          class MainActivity : ComponentActivity() {

              private val contacts = mutableStateListOf<Pair<String, String>>()
              private val recentCalls = mutableStateListOf<RecentCall>()
              private val setupDone = mutableStateOf(false)
              private var pendingNumber = ""

              private val contactsPermission =
                  registerForActivityResult(
                      ActivityResultContracts.RequestPermission()
                  ) { granted ->
                      if (granted) loadContacts()
                  }

              private val callLogPermission =
                  registerForActivityResult(
                      ActivityResultContracts.RequestPermission()
                  ) { granted ->
                      if (granted) loadRecent()
                  }

              private val callPhonePermission =
                  registerForActivityResult(
                      ActivityResultContracts.RequestPermission()
                  ) { granted ->
                      if (granted && pendingNumber.isNotBlank()) {
                          placePhoneCall(pendingNumber)
                      }
                  }

              private val rolePermission =
                  registerForActivityResult(
                      ActivityResultContracts.StartActivityForResult()
                  ) {
                      setupDone.value = isDefaultDialer()
                      if (setupDone.value) {
                          requestContactsPermission()
                          requestCallLogPermission()
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setupDone.value = isDefaultDialer()

                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) ==
                      PackageManager.PERMISSION_GRANTED) {
                      loadContacts()
                  }

                  if (setupDone.value) {
                      requestCallLogPermission()
                  }

                  setContent {
                      var number by remember { mutableStateOf("") }
                      var page by remember { mutableStateOf("Dialer") }

                      val green = Color(0xFF00C967)
                      val dark = Color(0xFF152333)

                      MaterialTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = Color.White
                          ) {
                              if (!setupDone.value) {
                                  Column(
                                      modifier = Modifier
                                          .fillMaxSize()
                                          .padding(25.dp),
                                      verticalArrangement = Arrangement.SpaceBetween
                                  ) {
                                      Column {
                                          Spacer(Modifier.height(35.dp))
                                          Text(
                                              "Welcome to ODialer",
                                              fontSize = 29.sp,
                                              fontWeight = FontWeight.Bold,
                                              color = dark
                                          )
                                          Spacer(Modifier.height(12.dp))
                                          Text(
                                              "Set ODialer as your default phone app to use the dialer and call history.",
                                              color = Color.Gray,
                                              fontSize = 16.sp
                                          )
                                          Spacer(Modifier.height(35.dp))
                                          Text(
                                              "✓  Default phone app",
                                              fontSize = 18.sp,
                                              fontWeight = FontWeight.Bold
                                          )
                                          Text(
                                              "Make and manage calls using ODialer.",
                                              color = Color.Gray,
                                              modifier = Modifier.padding(
                                                  start = 28.dp,
                                                  top = 5.dp
                                              )
                                          )
                                          Spacer(Modifier.height(25.dp))
                                          Text(
                                              "✓  Contacts",
                                              fontSize = 18.sp,
                                              fontWeight = FontWeight.Bold
                                          )
                                          Text(
                                              "Show your saved contacts.",
                                              color = Color.Gray,
                                              modifier = Modifier.padding(
                                                  start = 28.dp,
                                                  top = 5.dp
                                              )
                                          )
                                          Spacer(Modifier.height(25.dp))
                                          Text(
                                              "✓  Call history",
                                              fontSize = 18.sp,
                                              fontWeight = FontWeight.Bold
                                          )
                                          Text(
                                              "Show incoming, outgoing and missed calls.",
                                              color = Color.Gray,
                                              modifier = Modifier.padding(
                                                  start = 28.dp,
                                                  top = 5.dp
                                              )
                                          )
                                      }

                                      Column {
                                          Button(
                                              onClick = {
                                                  requestDefaultDialer()
                                              },
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .height(55.dp),
                                              colors = ButtonDefaults.buttonColors(
                                                  containerColor = green
                                              ),
                                              shape = RoundedCornerShape(15.dp)
                                          ) {
                                              Text(
                                                  "Set Default Phone",
                                                  fontSize = 17.sp
                                              )
                                          }

                                          Spacer(Modifier.height(12.dp))

                                          Button(
                                              onClick = {
                                                  if (isDefaultDialer()) {
                                                      setupDone.value = true
                                                      requestContactsPermission()
                                                      requestCallLogPermission()
                                                  } else {
                                                      requestDefaultDialer()
                                                  }
                                              },
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .height(55.dp),
                                              colors = ButtonDefaults.buttonColors(
                                                  containerColor = dark
                                              ),
                                              shape = RoundedCornerShape(15.dp)
                                          ) {
                                              Text("Continue", fontSize = 17.sp)
                                          }
                                      }
                                  }
                              } else {
                                  Column(
                                      modifier = Modifier
                                          .fillMaxSize()
                                          .padding(horizontal = 18.dp)
                                  ) {
                                      Row(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .padding(top = 12.dp),
                                          horizontalArrangement = Arrangement.SpaceBetween,
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Text(
                                              "ODialer",
                                              fontSize = 25.sp,
                                              fontWeight = FontWeight.Bold
                                          )

                                          TextButton(
                                              onClick = { requestDefaultDialer() }
                                          ) {
                                              Text("Default Phone", color = green)
                                          }
                                      }

                                      Row(
                                          modifier = Modifier.fillMaxWidth(),
                                          horizontalArrangement = Arrangement.SpaceEvenly
                                      ) {
                                          TextButton(onClick = {
                                              page = "Dialer"
                                          }) {
                                              Text(
                                                  "Dialer",
                                                  color = if (page == "Dialer") green
                                                  else Color.Gray
                                              )
                                          }

                                          TextButton(onClick = {
                                              page = "Recent"
                                              requestCallLogPermission()
                                              loadRecent()
                                          }) {
                                              Text(
                                                  "Recent",
                                                  color = if (page == "Recent") green
                                                  else Color.Gray
                                              )
                                          }
                                      }

                                      if (page == "Recent") {
                                          Text(
                                              "Recent Calls",
                                              fontSize = 22.sp,
                                              fontWeight = FontWeight.Bold,
                                              modifier = Modifier.padding(vertical = 12.dp)
                                          )

                                          if (recentCalls.isEmpty()) {
                                              Text(
                                                  "No recent calls available",
                                                  color = Color.Gray
                                              )
                                          } else {
                                              LazyColumn {
                                                  items(recentCalls) { call ->
                                                      Row(
                                                          modifier = Modifier
                                                              .fillMaxWidth()
                                                              .clickable {
                                                                  number = call.number
                                                                  page = "Dialer"
                                                              }
                                                              .padding(vertical = 12.dp),
                                                          verticalAlignment = Alignment.CenterVertically
                                                      ) {
                                                          Text(
                                                              when (call.type) {
                                                                  "Missed" -> "↙"
                                                                  "Incoming" -> "↙"
                                                                  else -> "↗"
                                                              },
                                                              color = if (call.type == "Missed")
                                                                  Color.Red else green,
                                                              fontSize = 25.sp
                                                          )

                                                          Column(
                                                              modifier = Modifier
                                                                  .weight(1f)
                                                                  .padding(start = 14.dp)
                                                          ) {
                                                              Text(
                                                                  call.name.ifBlank {
                                                                      call.number
                                                                  },
                                                                  fontWeight = FontWeight.Bold,
                                                                  fontSize = 17.sp
                                                              )
                                                              Text(
                                                                  "${call.type} • ${call.date}",
                                                                  color = Color.Gray,
                                                                  fontSize = 13.sp
                                                              )
                                                          }

                                                          TextButton(onClick = {
                                                              number = call.number
                                                              page = "Dialer"
                                                          }) {
                                                              Text("Call", color = green)
                                                          }
                                                      }
                                                      HorizontalDivider()
                                                  }
                                              }
                                          }
                                      } else {
                                          Text(
                                              "CONTACTS",
                                              color = Color.Gray,
                                              fontWeight = FontWeight.Bold,
                                              fontSize = 12.sp,
                                              modifier = Modifier.padding(
                                                  top = 8.dp,
                                                  bottom = 5.dp
                                              )
                                          )

                                          val suggestions =
                                              if (number.isBlank()) {
                                                  contacts.take(15)
                                              } else {
                                                  contacts.filter {
                                                      it.first.contains(number, true) ||
                                                      it.second.filter { c -> c.isDigit() }
                                                          .contains(
                                                              number.filter { c -> c.isDigit() }
                                                          )
                                                  }.take(15)
                                              }

                                          LazyColumn(
                                              modifier = Modifier
                                                  .weight(1f)
                                                  .fillMaxWidth()
                                          ) {
                                              items(suggestions) { contact ->
                                                  Row(
                                                      modifier = Modifier
                                                          .fillMaxWidth()
                                                          .clickable {
                                                              number = contact.second
                                                          }
                                                          .padding(vertical = 8.dp),
                                                      verticalAlignment = Alignment.CenterVertically
                                                  ) {
                                                      Box(
                                                          modifier = Modifier
                                                              .size(42.dp)
                                                              .clip(CircleShape)
                                                              .background(
                                                                  Color(0xFFE8EEF8)
                                                              ),
                                                          contentAlignment = Alignment.Center
                                                      ) {
                                                          Text(
                                                              contact.first.take(1).uppercase(),
                                                              color = Color(0xFF315A91),
                                                              fontWeight = FontWeight.Bold
                                                          )
                                                      }

                                                      Column(
                                                          modifier = Modifier
                                                              .weight(1f)
                                                              .padding(start = 12.dp)
                                                      ) {
                                                          Text(
                                                              contact.first,
                                                              fontWeight = FontWeight.SemiBold
                                                          )
                                                          Text(
                                                              contact.second,
                                                              color = Color.Gray,
                                                              fontSize = 13.sp
                                                          )
                                                      }
                                                  }
                                              }
                                          }

                                          Text(
                                              number,
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .padding(vertical = 8.dp),
                                              fontSize = 32.sp,
                                              textAlign = TextAlign.Center,
                                              fontWeight = FontWeight.Bold
                                          )

                                          val keys = listOf(
                                              listOf("1" to "", "2" to "ABC", "3" to "DEF"),
                                              listOf("4" to "GHI", "5" to "JKL", "6" to "MNO"),
                                              listOf("7" to "PQRS", "8" to "TUV", "9" to "WXYZ"),
                                              listOf("*" to "", "0" to "+", "#" to "")
                                          )

                                          keys.forEach { row ->
                                              Row(
                                                  modifier = Modifier
                                                      .fillMaxWidth()
                                                      .padding(vertical = 3.dp),
                                                  horizontalArrangement = Arrangement.SpaceEvenly
                                              ) {
                                                  row.forEach { key ->
                                                      Column(
                                                          modifier = Modifier
                                                              .weight(1f)
                                                              .padding(3.dp)
                                                              .clip(RoundedCornerShape(18.dp))
                                                              .background(Color(0xFFF1F3F5))
                                                              .clickable {
                                                                  number += key.first
                                                              }
                                                              .padding(vertical = 8.dp),
                                                          horizontalAlignment = Alignment.CenterHorizontally
                                                      ) {
                                                          Text(
                                                              key.first,
                                                              fontSize = 24.sp,
                                                              fontWeight = FontWeight.Medium
                                                          )
                                                          Text(
                                                              key.second,
                                                              fontSize = 9.sp,
                                                              color = Color.Gray
                                                          )
                                                      }
                                                  }
                                              }
                                          }

                                          Row(
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .padding(vertical = 8.dp),
                                              horizontalArrangement = Arrangement.Center,
                                              verticalAlignment = Alignment.CenterVertically
                                          ) {
                                              Button(
                                                  onClick = {
                                                      if (number.isNotBlank()) {
                                                          startPhoneCall(number)
                                                      }
                                                  },
                                                  shape = CircleShape,
                                                  colors = ButtonDefaults.buttonColors(
                                                      containerColor = green
                                                  ),
                                                  modifier = Modifier.size(64.dp)
                                              ) {
                                                  Text("☎", fontSize = 25.sp)
                                              }

                                              Spacer(Modifier.width(30.dp))

                                              TextButton(onClick = {
                                                  if (number.isNotEmpty()) {
                                                      number = number.dropLast(1)
                                                  }
                                              }) {
                                                  Text(
                                                      "⌫",
                                                      fontSize = 25.sp,
                                                      color = dark
                                                  )
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  setupDone.value = isDefaultDialer()

                  if (setupDone.value) {
                      if (checkSelfPermission(Manifest.permission.READ_CONTACTS) ==
                          PackageManager.PERMISSION_GRANTED) {
                          loadContacts()
                      }

                      if (checkSelfPermission(Manifest.permission.READ_CALL_LOG) ==
                          PackageManager.PERMISSION_GRANTED) {
                          loadRecent()
                      }
                  }
              }

              private fun isDefaultDialer(): Boolean {
                  val manager = getSystemService(RoleManager::class.java)
                  return manager?.isRoleHeld(RoleManager.ROLE_DIALER) == true
              }

              private fun requestDefaultDialer() {
                  val manager = getSystemService(RoleManager::class.java)

                  if (manager != null &&
                      manager.isRoleAvailable(RoleManager.ROLE_DIALER)) {
                      rolePermission.launch(
                          manager.createRequestRoleIntent(RoleManager.ROLE_DIALER)
                      )
                  }
              }

              private fun requestContactsPermission() {
                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) !=
                      PackageManager.PERMISSION_GRANTED) {
                      contactsPermission.launch(Manifest.permission.READ_CONTACTS)
                  } else {
                      loadContacts()
                  }
              }

              private fun requestCallLogPermission() {
                  if (!isDefaultDialer()) return

                  if (checkSelfPermission(Manifest.permission.READ_CALL_LOG) !=
                      PackageManager.PERMISSION_GRANTED) {
                      callLogPermission.launch(Manifest.permission.READ_CALL_LOG)
                  } else {
                      loadRecent()
                  }
              }

              private fun startPhoneCall(number: String) {
                  pendingNumber = number

                  if (checkSelfPermission(Manifest.permission.CALL_PHONE) ==
                      PackageManager.PERMISSION_GRANTED) {
                      placePhoneCall(number)
                  } else {
                      callPhonePermission.launch(Manifest.permission.CALL_PHONE)
                  }
              }

              private fun placePhoneCall(number: String) {
                  if (number.isBlank()) return

                  val intent = Intent(
                      Intent.ACTION_CALL,
                      Uri.fromParts("tel", number, null)
                  )
                  startActivity(intent)
              }

              private fun loadContacts() {
                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) !=
                      PackageManager.PERMISSION_GRANTED) return

                  contacts.clear()

                  val cursor = contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      arrayOf(
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                          ContactsContract.CommonDataKinds.Phone.NUMBER
                      ),
                      null,
                      null,
                      ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC"
                  )

                  cursor?.use {
                      val nameIndex = it.getColumnIndex(
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME
                      )
                      val numberIndex = it.getColumnIndex(
                          ContactsContract.CommonDataKinds.Phone.NUMBER
                      )

                      while (it.moveToNext()) {
                          val name = it.getString(nameIndex) ?: ""
                          val phone = it.getString(numberIndex) ?: ""
                          contacts.add(name to phone)
                      }
                  }
              }

              private fun loadRecent() {
                  if (checkSelfPermission(Manifest.permission.READ_CALL_LOG) !=
                      PackageManager.PERMISSION_GRANTED) return

                  recentCalls.clear()

                  val cursor = contentResolver.query(
                      CallLog.Calls.CONTENT_URI,
                      arrayOf(
                          CallLog.Calls.CACHED_NAME,
                          CallLog.Calls.NUMBER,
                          CallLog.Calls.TYPE,
                          CallLog.Calls.DATE
                      ),
                      null,
                      null,
                      CallLog.Calls.DATE + " DESC"
                  )

                  cursor?.use {
                      val nameIndex = it.getColumnIndex(CallLog.Calls.CACHED_NAME)
                      val numberIndex = it.getColumnIndex(CallLog.Calls.NUMBER)
                      val typeIndex = it.getColumnIndex(CallLog.Calls.TYPE)
                      val dateIndex = it.getColumnIndex(CallLog.Calls.DATE)

                      while (it.moveToNext()) {
                          val typeValue = it.getInt(typeIndex)

                          val type = when (typeValue) {
                              CallLog.Calls.INCOMING_TYPE -> "Incoming"
                              CallLog.Calls.MISSED_TYPE -> "Missed"
                              CallLog.Calls.OUTGOING_TYPE -> "Outgoing"
                              CallLog.Calls.REJECTED_TYPE -> "Missed"
                              else -> "Call"
                          }

                          val date = SimpleDateFormat(
                              "dd MMM, hh:mm a",
                              Locale.getDefault()
                          ).format(Date(it.getLong(dateIndex)))

                          recentCalls.add(
                              RecentCall(
                                  it.getString(nameIndex) ?: "",
                                  it.getString(numberIndex) ?: "",
                                  type,
                                  date
                              )
                          )
                      }
                  }
              }
          }
          EOF

      - name: Create In-call service
        run: |
          cat > app/src/main/java/com/motog85/odialer/PhoneInCallService.kt <<'EOF'
          package com.motog85.odialer

          import android.content.Intent
          import android.telecom.Call
          import android.telecom.InCallService

          class PhoneInCallService : InCallService() {

              override fun onCallAdded(call: Call) {
                  super.onCallAdded(call)

                  CallActivity.currentCall = call

                  val intent = Intent(this, CallActivity::class.java)
                  intent.addFlags(
                      Intent.FLAG_ACTIVITY_NEW_TASK or
                      Intent.FLAG_ACTIVITY_SINGLE_TOP
                  )
                  startActivity(intent)
              }

              override fun onCallRemoved(call: Call) {
                  super.onCallRemoved(call)

                  if (CallActivity.currentCall == call) {
                      CallActivity.currentCall = null
                  }
              }
          }
          EOF

      - name: Create Call screen
        run: |
          cat > app/src/main/java/com/motog85/odialer/CallActivity.kt <<'EOF'
          package com.motog85.odialer

          import android.os.Bundle
          import android.telecom.Call
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.material3.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class CallActivity : ComponentActivity() {

              companion object {
                  var currentCall: Call? = null
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContent {
                      val call = currentCall
                      val incoming = call?.state == Call.STATE_RINGING

                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(Color(0xFF101C2C))
                              .padding(24.dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.SpaceEvenly
                      ) {
                          Text(
                              if (incoming) "Incoming call" else "Call",
                              color = Color.White,
                              fontSize = 24.sp
                          )

                          Text(
                              call?.details?.handle?.schemeSpecificPart ?: "Unknown",
                              color = Color.White,
                              fontSize = 22.sp
                          )

                          Row(
                              horizontalArrangement = Arrangement.spacedBy(25.dp)
                          ) {
                              if (incoming) {
                                  Button(
                                      onClick = { call?.answer(0) },
                                      colors = ButtonDefaults.buttonColors(
                                          containerColor = Color(0xFF00C967)
                                      ),
                                      shape = CircleShape
                                  ) {
                                      Text("Answer")
                                  }

                                  Button(
                                      onClick = { call?.disconnect() },
                                      colors = ButtonDefaults.buttonColors(
                                          containerColor = Color.Red
                                      ),
                                      shape = CircleShape
                                  ) {
                                      Text("Decline")
                                  }
                              } else {
                                  Button(
                                      onClick = { call?.disconnect() },
                                      colors = ButtonDefaults.buttonColors(
                                          containerColor = Color.Red
                                      ),
                                      shape = CircleShape
                                  ) {
                                      Text("End call")
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ODialer-MotoG85-v4
          path: app/build/outputs/apk/debug/app-debug.apk

