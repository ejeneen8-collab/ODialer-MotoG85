          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.delay
          import java.util.Locale

          class CallActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(
                      WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or
                      WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON or
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  )
                  showCallScreen()
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  showCallScreen()
              }

              private fun showCallScreen() {
                  setContent {
                      val call = CallStore.currentCall
                      val revision = CallStore.revision
                      val route = CallStore.audioRoute
                      val routes = CallStore.supportedRoutes
                      val muted = CallStore.muted
                      var keypadVisible by remember { mutableStateOf(false) }
                      var recordMessage by remember { mutableStateOf(false) }
                      var elapsed by remember { mutableLongStateOf(0L) }
                      val number = call?.details?.handle?.schemeSpecificPart.orEmpty()
                      val contactName = remember(number) { lookupContactName(number) }
                      val incoming = call?.state == Call.STATE_RINGING
                      val active = call?.state == Call.STATE_ACTIVE
                      val holding = call?.state == Call.STATE_HOLDING
                      val connectTime = call?.details?.connectTimeMillis ?: 0L

                      LaunchedEffect(call, active, connectTime, revision) {
                          while (call != null && active) {
                              elapsed = if (connectTime > 0L)
                                  ((System.currentTimeMillis() - connectTime) / 1000L).coerceAtLeast(0L)
                              else 0L
                              delay(1000)
                          }
                      }

                      MaterialTheme {
