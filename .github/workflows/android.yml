
name: Build ODialer Moto G85

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Extract Android project
        run: |
          mkdir -p /tmp/odialer-src
          unzip -q ODialer-MotoG85-starter.zip -d /tmp/odialer-src
          cp -a /tmp/odialer-src/ODialer-MotoG85/. .

      - name: Install permanent green phone icon
        run: |
          mkdir -p /tmp/odialer-icon
          unzip -q ODialer-permanent-icon-resources.zip -d /tmp/odialer-icon
          cp -a /tmp/odialer-icon/app/src/main/res/. app/src/main/res/

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"

          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")

          if app is None:
              raise SystemExit("Application tag not found")

          app.set(ns + "icon", "@mipmap/ic_launcher")
          app.set(ns + "roundIcon", "@mipmap/ic_launcher_round")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"

          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")

          if app is None:
              raise SystemExit("Application tag not found")

          permissions = [
              "android.permission.READ_CONTACTS",
              "android.permission.READ_CALL_LOG",
              "android.permission.CALL_PHONE",
              "android.permission.READ_PHONE_STATE"
          ]

          for permission in permissions:
              if not any(x.get(ns+"name") == permission for x in root.findall("uses-permission")):
                  ET.SubElement(root, "uses-permission", {ns+"name": permission})

          main = None
          for activity in app.findall("activity"):
              if activity.get(ns+"name", "").endswith("MainActivity"):
                  main = activity
                  break

          if main is None:
              main = ET.SubElement(app, "activity", {ns+"name": ".MainActivity"})

          main.set(ns+"exported", "true")

          for old in list(main.findall("intent-filter")):
              main.remove(old)

          dial_filter = ET.SubElement(main, "intent-filter")
          ET.SubElement(dial_filter, "action", {ns+"name": "android.intent.action.DIAL"})
          ET.SubElement(dial_filter, "category", {ns+"name": "android.intent.category.DEFAULT"})

          tel_filter = ET.SubElement(main, "intent-filter")
          ET.SubElement(tel_filter, "action", {ns+"name": "android.intent.action.DIAL"})
          ET.SubElement(tel_filter, "category", {ns+"name": "android.intent.category.DEFAULT"})
          ET.SubElement(tel_filter, "data", {ns+"scheme": "tel"})

          if not any(x.get(ns+"name") == ".CallActivity" for x in app.findall("activity")):
              ET.SubElement(app, "activity", {
                  ns+"name": ".CallActivity",
                  ns+"exported": "false"
              })

          service = None
          for item in app.findall("service"):
              if item.get(ns+"name", "").endswith("PhoneInCallService"):
                  service = item
                  break

          if service is None:
              service = ET.SubElement(app, "service", {
                  ns+"name": ".PhoneInCallService",
                  ns+"permission": "android.permission.BIND_INCALL_SERVICE",
                  ns+"exported": "true"
              })

          service.set(ns+"permission", "android.permission.BIND_INCALL_SERVICE")
          service.set(ns+"exported", "true")

          if not service.findall("intent-filter"):
              intent = ET.SubElement(service, "intent-filter")
              ET.SubElement(intent, "action", {
                  ns+"name": "android.telecom.InCallService"
              })

          if not service.findall("meta-data"):
              ET.SubElement(service, "meta-data", {
                  ns+"name": "android.telecom.IN_CALL_SERVICE_UI",
                  ns+"value": "true"
              })

          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Create Main Dialer
        run: |
          cat > app/src/main/java/com/motog85/odialer/MainActivity.kt <<'EOF'
          package com.motog85.odialer

          import android.Manifest
          import android.app.role.RoleManager
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.CallLog
          import android.provider.ContactsContract
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          data class RecentCall(
              val name: String,
              val number: String,
              val type: String,
              val date: String
          )

          class MainActivity : ComponentActivity() {

              private val contacts = mutableStateListOf<Pair<String, String>>()
              private val recentCalls = mutableStateListOf<RecentCall>()

              private val contactsPermission =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) {
                      if (it) loadContacts()
                  }

              private val callLogPermission =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) {
                      if (it) loadRecent()
                  }

              private val rolePermission =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) {
                      if (isDefaultDialer()) {
                          requestCallLogPermission()
                          if (checkSelfPermission(Manifest.permission.READ_CONTACTS) ==
                              PackageManager.PERMISSION_GRANTED) {
                              loadContacts()
                          }
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) ==
                      PackageManager.PERMISSION_GRANTED) {
                      loadContacts()
                  }

                  setContent {
                      var number by remember { mutableStateOf("") }
                      var page by remember { mutableStateOf("Dialer") }
                      var setupDone by remember { mutableStateOf(isDefaultDialer()) }

                      val green = Color(0xFF00C967)
                      val dark = Color(0xFF152333)

                      MaterialTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = Color.White
                          ) {
                              if (!setupDone) {
                                  Column(
                                      modifier = Modifier
                                          .fillMaxSize()
                                          .padding(25.dp),
                                      verticalArrangement = Arrangement.SpaceBetween
                                  ) {
                                      Column {
                                          Spacer(Modifier.height(35.dp))
                                          Text(
                                              "Welcome to ODialer",
                                              fontSize = 29.sp,
                                              fontWeight = FontWeight.Bold,
                                              color = dark
                                          )
                                          Spacer(Modifier.height(12.dp))
                                          Text(
                                              "To get started, set ODialer as your default phone app and allow the required permissions.",
                                              color = Color.Gray,
                                              fontSize = 16.sp
                                          )
                                          Spacer(Modifier.height(35.dp))

                                          Text(
                                              "✓  Default phone app",
                                              fontSize = 18.sp,
                                              fontWeight = FontWeight.Bold
                                          )
                                          Text(
                                              "Make and manage calls using ODialer.",
                                              color = Color.Gray,
                                              modifier = Modifier.padding(start = 28.dp, top = 5.dp)
                                          )

                                          Spacer(Modifier.height(25.dp))

                                          Text(
                                              "✓  Contacts",
                                              fontSize = 18.sp,
                                              fontWeight = FontWeight.Bold
                                          )
                                          Text(
                                              "Show your saved contacts.",
                                              color = Color.Gray,
                                              modifier = Modifier.padding(start = 28.dp, top = 5.dp)
                                          )

                                          Spacer(Modifier.height(25.dp))

                                          Text(
                                              "✓  Call history",
                                              fontSize = 18.sp,
                                              fontWeight = FontWeight.Bold
                                          )
                                          Text(
                                              "Show incoming, outgoing and missed calls.",
                                              color = Color.Gray,
                                              modifier = Modifier.padding(start = 28.dp, top = 5.dp)
                                          )
                                      }

                                      Column {
                                          Button(
                                              onClick = {
                                                  requestDefaultDialer()
                                              },
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .height(55.dp),
                                              colors = ButtonDefaults.buttonColors(
                                                  containerColor = green
                                              ),
                                              shape = RoundedCornerShape(15.dp)
                                          ) {
                                              Text("Set Default Phone", fontSize = 17.sp)
                                          }

                                          Spacer(Modifier.height(12.dp))

                                          Button(
                                              onClick = {
                                                  if (isDefaultDialer()) {
                                                      setupDone = true
                                                      requestContactsPermission()
                                                      requestCallLogPermission()
                                                  } else {
                                                      requestDefaultDialer()
                                                  }
                                              },
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .height(55.dp),
                                              colors = ButtonDefaults.buttonColors(
                                                  containerColor = dark
                                              ),
                                              shape = RoundedCornerShape(15.dp)
                                          ) {
                                              Text("Continue", fontSize = 17.sp)
                                          }
                                      }
                                  }
                              } else {
                                  Column(
                                      modifier = Modifier
                                          .fillMaxSize()
                                          .padding(horizontal = 18.dp)
                                  ) {
                                      Row(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .padding(top = 12.dp),
                                          horizontalArrangement = Arrangement.SpaceBetween,
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Text(
                                              "ODialer",
                                              fontSize = 25.sp,
                                              fontWeight = FontWeight.Bold
                                          )

                                          TextButton(
                                              onClick = { requestDefaultDialer() }
                                          ) {
                                              Text("Default Phone", color = green)
                                          }
                                      }

                                      Row(
                                          modifier = Modifier.fillMaxWidth(),
                                          horizontalArrangement = Arrangement.SpaceEvenly
                                      ) {
                                          TextButton(onClick = { page = "Dialer" }) {
                                              Text(
                                                  "Dialer",
                                                  color = if (page == "Dialer") green else Color.Gray
                                              )
                                          }

                                          TextButton(onClick = {
                                              page = "Recent"
                                              requestCallLogPermission()
                                          }) {
                                              Text(
                                                  "Recent",
                                                  color = if (page == "Recent") green else Color.Gray
                                              )
                                          }
                                      }

                                      if (page == "Recent") {
                                          Text(
                                              "Recent Calls",
                                              fontSize = 22.sp,
                                              fontWeight = FontWeight.Bold,
                                              modifier = Modifier.padding(vertical = 12.dp)
                                          )

                                          if (recentCalls.isEmpty()) {
                                              Text(
                                                  "No recent calls available",
                                                  color = Color.Gray
                                              )
                                          } else {
                                              LazyColumn {
                                                  items(recentCalls) { call ->
                                                      Row(
                                                          modifier = Modifier
                                                              .fillMaxWidth()
                                                              .clickable {
                                                                  number = call.number
                                                                  page = "Dialer"
                                                              }
                                                              .padding(vertical = 12.dp),
                                                          verticalAlignment = Alignment.CenterVertically
                                                      ) {
                                                          Text(
                                                              when (call.type) {
                                                                  "Missed" -> "↙"
                                                                  "Incoming" -> "↙"
                                                                  else -> "↗"
                                                              },
                                                              color = if (call.type == "Missed") Color.Red else green,
                                                              fontSize = 25.sp
                                                          )

                                                          Column(
                                                              modifier = Modifier
                                                                  .weight(1f)
                                                                  .padding(start = 14.dp)
                                                          ) {
                                                              Text(
                                                                  call.name.ifBlank { call.number },
                                                                  fontWeight = FontWeight.Bold,
                                                                  fontSize = 17.sp
                                                              )
                                                              Text(
                                                                  "${call.type} • ${call.date}",
                                                                  color = Color.Gray,
                                                                  fontSize = 13.sp
                                                              )
                                                          }

                                                          TextButton(onClick = {
                                                              number = call.number
                                                              page = "Dialer"
                                                          }) {
                                                              Text("Call", color = green)
                                                          }
                                                      }
                                                      HorizontalDivider()
                                                  }
                                              }
                                          }
                                      } else {
                                          Text(
                                              "CONTACTS",
                                              color = Color.Gray,
                                              fontWeight = FontWeight.Bold,
                                              fontSize = 12.sp,
                                              modifier = Modifier.padding(top = 8.dp, bottom = 5.dp)
                                          )

                                          val suggestions = if (number.isBlank()) {
                                              contacts.take(15)
                                          } else {
                                              contacts.filter {
                                                  it.first.contains(number, true) ||
                                                      it.second.filter { c -> c.isDigit() }
                                                          .contains(number.filter { c -> c.isDigit() })
                                              }.take(15)
                                          }

                                          LazyColumn(
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .weight(1f)
                                          ) {
                                              items(suggestions) { contact ->
                                                  Row(
                                                      modifier = Modifier
                                                          .fillMaxWidth()
                                                          .clickable { number = contact.second }
                                                          .padding(vertical = 8.dp),
                                                      verticalAlignment = Alignment.CenterVertically
                                                  ) {
                                                      Box(
                                                          modifier = Modifier
                                                              .size(42.dp)
                                                              .clip(CircleShape)
                                                              .background(Color(0xFFE8EEF8)),
                                                          contentAlignment = Alignment.Center
                                                      ) {
                                                          Text(
                                                              contact.first.take(1).uppercase(),
                                                              color = Color(0xFF315A91),
                                                              fontWeight = FontWeight.Bold
                                                          )
                                                      }

                                                      Column(
                                                          modifier = Modifier
                                                              .weight(1f)
                                                              .padding(start = 12.dp)
                                                      ) {
                                                          Text(
                                                              contact.first,
                                                              fontWeight = FontWeight.SemiBold
                                                          )
                                                          Text(
                                                              contact.second,
                                                              color = Color.Gray,
                                                              fontSize = 13.sp
                                                          )
                                                      }
                                                  }
                                              }
                                          }

                                          Text(
                                              number.ifBlank { "Enter number" },
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .padding(vertical = 8.dp),
                                              fontSize = 30.sp,
                                              textAlign = TextAlign.Center,
                                              fontWeight = FontWeight.Bold
                                          )

                                          val keys = listOf(
                                              listOf("1" to "", "2" to "ABC", "3" to "DEF"),
                                              listOf("4" to "GHI", "5" to "JKL", "6" to "MNO"),
                                              listOf("7" to "PQRS", "8" to "TUV", "9" to "WXYZ"),
                                              listOf("*" to "", "0" to "+", "#" to "")
                                          )

                                          keys.forEach { row ->
                                              Row(
                                                  modifier = Modifier
                                                      .fillMaxWidth()
                                                      .padding(vertical = 3.dp),
                                                  horizontalArrangement = Arrangement.SpaceEvenly
                                              ) {
                                                  row.forEach { key ->
                                                      Column(
                                                          modifier = Modifier
                                                              .size(75.dp)
                                                              .clip(CircleShape)
                                                              .background(Color(0xFFF0F2F4))
                                                              .clickable { number += key.first },
                                                          horizontalAlignment = Alignment.CenterHorizontally,
                                                          verticalArrangement = Arrangement.Center
                                                      ) {
                                                          Text(
                                                              key.first,
                                                              fontSize = 25.sp,
                                                              fontWeight = FontWeight.Medium
                                                          )
                                                          Text(
                                                              key.second,
                                                              fontSize = 9.sp,
                                                              color = Color.Gray
                                                          )
                                                      }
                                                  }
                                              }
                                          }

                                          Row(
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .padding(vertical = 12.dp),
                                              horizontalArrangement = Arrangement.SpaceEvenly,
                                              verticalAlignment = Alignment.CenterVertically
                                          ) {
                                              TextButton(onClick = {
                                                  if (number.isNotEmpty()) {
                                                      number = number.dropLast(1)
                                                  }
                                              }) {
                                                  Text("⌫", fontSize = 25.sp)
                                              }

                                              Button(
                                                  onClick = { makeCall(number) },
                                                  modifier = Modifier.size(65.dp),
                                                  shape = CircleShape,
                                                  colors = ButtonDefaults.buttonColors(
                                                      containerColor = green
                                                  )
                                              ) {
                                                  Text("☎", fontSize = 25.sp)
                                              }

                                              TextButton(onClick = {
                                                  number = ""
                                              }) {
                                                  Text("Clear", fontSize = 14.sp)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              private fun isDefaultDialer(): Boolean {
                  val roleManager = getSystemService(RoleManager::class.java)
                  return roleManager?.isRoleHeld(RoleManager.ROLE_DIALER) == true
              }

              private fun requestDefaultDialer() {
                  val roleManager = getSystemService(RoleManager::class.java)
                  if (roleManager != null &&
                      roleManager.isRoleAvailable(RoleManager.ROLE_DIALER) &&
                      !roleManager.isRoleHeld(RoleManager.ROLE_DIALER)) {
                      rolePermission.launch(
                          roleManager.createRequestRoleIntent(RoleManager.ROLE_DIALER)
                      )
                  } else if (isDefaultDialer()) {
                      requestContactsPermission()
                      requestCallLogPermission()
                  }
              }

              private fun requestContactsPermission() {
                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) !=
                      PackageManager.PERMISSION_GRANTED) {
                      contactsPermission.launch(Manifest.permission.READ_CONTACTS)
                  } else {
                      loadContacts()
                  }
              }

              private fun requestCallLogPermission() {
                  if (!isDefaultDialer()) return

                  if (checkSelfPermission(Manifest.permission.READ_CALL_LOG) !=
                      PackageManager.PERMISSION_GRANTED) {
                      callLogPermission.launch(Manifest.permission.READ_CALL_LOG)
                  } else {
                      loadRecent()
                  }
              }

              private fun loadContacts() {
                  contacts.clear()
                  try {
                      val cursor = contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          arrayOf(
                              ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                              ContactsContract.CommonDataKinds.Phone.NUMBER
                          ),
                          null,
                          null,
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC"
                      )

                      cursor?.use {
                          while (it.moveToNext()) {
                              val name = it.getString(0) ?: ""
                              val phone = it.getString(1) ?: ""
                              contacts.add(name to phone)
                          }
                      }
                  } catch (_: Exception) {
                  }
              }

              private fun loadRecent() {
                  if (!isDefaultDialer()) return
                  recentCalls.clear()

                  try {
                      val cursor = contentResolver.query(
                          CallLog.Calls.CONTENT_URI,
                          arrayOf(
                              CallLog.Calls.CACHED_NAME,
                              CallLog.Calls.NUMBER,
                              CallLog.Calls.TYPE,
                              CallLog.Calls.DATE
                          ),
                          null,
                          null,
                          CallLog.Calls.DATE + " DESC"
                      )

                      cursor?.use {
                          while (it.moveToNext()) {
                              val name = it.getString(0) ?: ""
                              val phone = it.getString(1) ?: ""
                              val typeValue = it.getInt(2)
                              val time = it.getLong(3)

                              val type = when (typeValue) {
                                  CallLog.Calls.INCOMING_TYPE -> "Incoming"
                                  CallLog.Calls.MISSED_TYPE -> "Missed"
                                  CallLog.Calls.OUTGOING_TYPE -> "Outgoing"
                                  else -> "Call"
                              }

                              val date = SimpleDateFormat(
                                  "dd MMM, hh:mm a",
                                  Locale.getDefault()
                              ).format(Date(time))

                              recentCalls.add(RecentCall(name, phone, type, date))
                          }
                      }
                  } catch (_: Exception) {
                  }
              }

              private fun makeCall(number: String) {
                  if (number.isBlank()) return

                  try {
                      val intent = Intent(
                          Intent.ACTION_CALL,
                          Uri.parse("tel:" + Uri.encode(number))
                      )
                      startActivity(intent)
                  } catch (_: SecurityException) {
                      requestDefaultDialer()
                  } catch (_: Exception) {
                      val intent = Intent(
                          Intent.ACTION_DIAL,
                          Uri.parse("tel:" + Uri.encode(number))
                      )
                      startActivity(intent)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  if (isDefaultDialer()) {
                      if (checkSelfPermission(Manifest.permission.READ_CONTACTS) ==
                          PackageManager.PERMISSION_GRANTED) {
                          loadContacts()
                      }
                      if (checkSelfPermission(Manifest.permission.READ_CALL_LOG) ==
                          PackageManager.PERMISSION_GRANTED) {
                          loadRecent()
                      }
                  }
              }
          }
          EOF

      - name: Create InCallService
        run: |
          cat > app/src/main/java/com/motog85/odialer/PhoneInCallService.kt <<'EOF'
          package com.motog85.odialer

          import android.telecom.Call
          import android.telecom.InCallService

          class PhoneInCallService : InCallService() {

              override fun onCallAdded(call: Call) {
                  super.onCallAdded(call)
                  currentCall = call
                  val intent = android.content.Intent(this, CallActivity::class.java)
                  intent.addFlags(
                      android.content.Intent.FLAG_ACTIVITY_NEW_TASK or
                      android.content.Intent.FLAG_ACTIVITY_SINGLE_TOP
                  )
                  startActivity(intent)
              }

              override fun onCallRemoved(call: Call) {
                  super.onCallRemoved(call)
                  if (currentCall == call) currentCall = null
              }

              companion object {
                  var currentCall: Call? = null
              }
          }
          EOF

      - name: Create Call Screen
        run: |
          cat > app/src/main/java/com/motog85/odialer/CallActivity.kt <<'EOF'
          package com.motog85.odialer

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import android.telecom.Call

          class CallActivity : ComponentActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContent {
                      var state by remember { mutableIntStateOf(0) }
                      val call = PhoneInCallService.currentCall

                      Surface(
                          modifier = Modifier.fillMaxSize(),
                          color = Color(0xFF101D32)
                      ) {
                          Column(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .padding(25.dp),
                              horizontalAlignment = Alignment.CenterHorizontally,
                              verticalArrangement = Arrangement.SpaceEvenly
                          ) {
                              Text(
                                  "ODialer",
                                  color = Color.White,
                                  fontSize = 28.sp
                              )

                              Text(
                                  when (call?.state) {
                                      Call.STATE_RINGING -> "Incoming call"
                                      Call.STATE_ACTIVE -> "Call connected"
                                      Call.STATE_DIALING -> "Calling..."
                                      else -> "Call"
                                  },
                                  color = Color.White,
                                  fontSize = 22.sp
                              )

                              Button(
                                  onClick = {
                                      call?.answer(0)
                                  },
                                  enabled = call?.state == Call.STATE_RINGING,
                                  colors = ButtonDefaults.buttonColors(
                                      containerColor = Color(0xFF00C967)
                                  )
                              ) {
                                  Text("Answer")
                              }

                              Button(
                                  onClick = {
                                      call?.disconnect()
                                      finish()
                                  },
                                  colors = ButtonDefaults.buttonColors(
                                      containerColor = Color.Red
                                  )
                              ) {
                                  Text("End Call")
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Set Java compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          if "compileOptions" not in s:
              s += """
          
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ODialer-MotoG85-v3
          path: app/build/outputs/apk/debug/app-debug.apk
