
name: Build ODialer Moto G85

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses and install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Extract Android project
        run: |
          mkdir -p /tmp/odialer-src
          unzip -q ODialer-MotoG85-starter.zip -d /tmp/odialer-src
          cp -a /tmp/odialer-src/ODialer-MotoG85/. .

      - name: Set app name and create launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/color
          mkdir -p app/src/main/res/mipmap-anydpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"

          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")

          app.set(ns + "label", "Calling Dialer")
          app.set(ns + "icon", "@mipmap/ic_launcher")
          app.set(ns + "roundIcon", "@mipmap/ic_launcher")

          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M6.62,10.79a15.05,15.05 0,0 0,6.59 6.59l2.2,-2.2a1,1 0,0 1,1.01 -0.24c1.12,0.37 2.33,0.57 3.58,0.57a1,1 0,0 1,1 1L21,20a1,1 0,0 1,-1 1C10.61,21 3,13.39 3,4a1,1 0,0 1,1 -1h3.5a1,1 0,0 1,1 1c0,1.25 0.2,2.46 0.57,3.58a1,1 0,0 1,-0.25 1.01z"/>
          </vector>
          EOF

          cat > app/src/main/res/color/ic_launcher_background.xml <<'EOF'
          <resources>
              <color name="ic_launcher_background">#173B72</color>
          </resources>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FF173B72"
                  android:pathData="M0,0h24v24H0z"/>
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M6.62,10.79a15.05,15.05 0,0 0,6.59 6.59l2.2,-2.2a1,1 0,0 1,1.01 -0.24c1.12,0.37 2.33,0.57 3.58,0.57a1,1 0,0 1,1 1L21,20a1,1 0,0 1,-1 1C10.61,21 3,13.39 3,4a1,1 0,0 1,1 -1h3.5a1,1 0,0 1,1 1c0,1.25 0.2,2.46 0.57,3.58a1,1 0,0 1,-0.25 1.01z"/>
          </vector>
          EOF

      - name: Update Dialer screen
        run: |
          cat > app/src/main/java/com/motog85/odialer/MainActivity.kt <<'EOF'
          package com.motog85.odialer

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContent {
                      var number by remember { mutableStateOf("") }

                      MaterialTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = androidx.compose.ui.graphics.Color(0xFF101B32)
                          ) {
                              Column(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .padding(18.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  verticalArrangement = Arrangement.SpaceBetween
                              ) {
                                  Text(
                                      "Calling Dialer",
                                      color = androidx.compose.ui.graphics.Color.White,
                                      fontSize = 30.sp
                                  )

                                  Text(
                                      number.ifEmpty { "नंबर डालें" },
                                      color = androidx.compose.ui.graphics.Color.White,
                                      fontSize = 28.sp
                                  )

                                  OutlinedButton(
                                      onClick = {
                                          if (number.isNotEmpty()) {
                                              number = number.dropLast(1)
                                          }
                                      }
                                  ) {
                                      Text("⌫  Delete")
                                  }

                                  Column {
                                      val rows = listOf(
                                          listOf("1", "2", "3"),
                                          listOf("4", "5", "6"),
                                          listOf("7", "8", "9"),
                                          listOf("*", "0", "#")
                                      )

                                      rows.forEach { row ->
                                          Row(modifier = Modifier.fillMaxWidth()) {
                                              row.forEach { digit ->
                                                  Button(
                                                      onClick = { number += digit },
                                                      modifier = Modifier
                                                          .weight(1f)
                                                          .padding(5.dp),
                                                      shape = RoundedCornerShape(18.dp)
                                                  ) {
                                                      Text(digit, fontSize = 26.sp)
                                                  }
                                              }
                                          }
                                      }
                                  }

                                  Button(
                                      onClick = {
                                          if (number.isNotBlank()) {
                                              val intent = Intent(
                                                  Intent.ACTION_DIAL,
                                                  Uri.parse("tel:$number")
                                              )
                                              startActivity(intent)
                                          }
                                      },
                                      enabled = number.isNotBlank(),
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .height(60.dp),
                                      colors = ButtonDefaults.buttonColors(
                                          containerColor =
                                              androidx.compose.ui.graphics.Color(0xFF19A76B)
                                      )
                                  ) {
                                      Text("📞  Call", fontSize = 22.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Set Java and Kotlin target to 17
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ODialer-MotoG85-APK
          path: app/build/outputs/apk/debug/app-debug.apk
