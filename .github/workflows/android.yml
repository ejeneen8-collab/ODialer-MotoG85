                                  TextButton(onClick = { recordMessage = false }) { Text("ठीक है") }
                              }
                          )
                      }
                  }
              }

              private fun lookupContactName(phone: String): String {
                  if (phone.isBlank()) return ""
                  return try {
                      val uri = Uri.withAppendedPath(
                          ContactsContract.PhoneLookup.CONTENT_FILTER_URI,
                          Uri.encode(phone)
                      )
                      contentResolver.query(
                          uri,
                          arrayOf(ContactsContract.PhoneLookup.DISPLAY_NAME),
                          null, null, null
                      )?.use { cursor ->
                          if (cursor.moveToFirst()) cursor.getString(0).orEmpty() else ""
                      }.orEmpty()
                  } catch (_: Exception) { "" }
              }
          }

          @Composable
          private fun BigCallButton(label: String, color: Color, onClick: () -> Unit) {
              Button(
                  onClick = onClick,
                  modifier = Modifier.width(145.dp).height(62.dp),
                  shape = RoundedCornerShape(32.dp),
                  colors = ButtonDefaults.buttonColors(containerColor = color)
              ) {
                  Text(label, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold)
              }
          }

          @Composable
          private fun ControlButton(
              label: String,
              selected: Boolean,
              enabled: Boolean,
              onClick: () -> Unit
          ) {
              Column(
                  modifier = Modifier.width(92.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  FilledTonalButton(
                      onClick = onClick,
                      enabled = enabled,
                      modifier = Modifier.size(66.dp),
                      shape = CircleShape,
                      colors = ButtonDefaults.filledTonalButtonColors(
                          containerColor = if (selected) Color(0xFF00A86B) else Color(0xFF263B59),
                          contentColor = Color.White,
                          disabledContainerColor = Color(0xFF1D2B40),
                          disabledContentColor = Color(0xFF718096)
                      )
                  ) {
                      Text(label.take(1), fontSize = 22.sp, fontWeight = FontWeight.Bold)
                  }
                  Spacer(Modifier.height(5.dp))
                  Text(label, color = if (enabled) Color.White else Color(0xFF718096),
                      fontSize = 12.sp, textAlign = TextAlign.Center)
              }
          }

          private fun formatDuration(seconds: Long): String {
              val hours = seconds / 3600
              val minutes = (seconds % 3600) / 60
              val secs = seconds % 60
              return if (hours > 0) "%d:%02d:%02d".format(hours, minutes, secs)
              else "%02d:%02d".format(minutes, secs)
          }
          EOF

      - name: Build APK
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ODialer-MotoG85-v5-call-controls
          path: app/build/outputs/apk/debug/app-debug.apk
