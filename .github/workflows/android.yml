      - name: Create In-call service and call controller
        run: |
          cat > app/src/main/java/com/motog85/odialer/PhoneInCallService.kt <<'EOF'
          package com.motog85.odialer

          import android.content.Intent
          import android.telecom.Call
          import android.telecom.CallAudioState
          import android.telecom.InCallService
          import android.os.Handler
          import android.os.Looper
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue

          object CallStore {
              var currentCall by mutableStateOf<Call?>(null)
              var service: PhoneInCallService? = null
              var audioRoute by mutableStateOf(CallAudioState.ROUTE_EARPIECE)
              var supportedRoutes by mutableStateOf(CallAudioState.ROUTE_EARPIECE)
              var muted by mutableStateOf(false)
              var revision by mutableStateOf(0)
              private val mainHandler = Handler(Looper.getMainLooper())

              val callback = object : Call.Callback() {
                  override fun onStateChanged(call: Call, state: Int) {
                      mainHandler.post { revision++ }
                  }
                  override fun onDetailsChanged(call: Call, details: Call.Details) {
                      mainHandler.post { revision++ }
                  }
                  override fun onParentChanged(call: Call, parent: Call?) {
                      mainHandler.post { revision++ }
                  }
              }

              fun attach(call: Call) {
                  currentCall?.unregisterCallback(callback)
                  currentCall = call
                  call.registerCallback(callback, mainHandler)
                  revision++
              }

              fun detach(call: Call) {
                  call.unregisterCallback(callback)
                  if (currentCall === call) currentCall = null
                  revision++
              }

              fun setRoute(route: Int) {
                  service?.setAudioRoute(route)
              }

              fun toggleMute() {
                  muted = !muted
                  service?.setMuted(muted)
              }
          }

          class PhoneInCallService : InCallService() {
              override fun onCreate() {
                  super.onCreate()
                  CallStore.service = this
              }

              override fun onCallAdded(call: Call) {
                  super.onCallAdded(call)
                  CallStore.attach(call)
                  val intent = Intent(this, CallActivity::class.java).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                  }
                  startActivity(intent)
              }

              override fun onCallRemoved(call: Call) {
                  CallStore.detach(call)
                  super.onCallRemoved(call)
              }

              override fun onCallAudioStateChanged(audioState: CallAudioState) {
                  super.onCallAudioStateChanged(audioState)
                  CallStore.audioRoute = audioState.route
                  CallStore.supportedRoutes = audioState.supportedRouteMask
                  CallStore.muted = audioState.isMuted
              }

              override fun onDestroy() {
                  if (CallStore.service === this) CallStore.service = null
                  super.onDestroy()
              }
          }
          EOF

