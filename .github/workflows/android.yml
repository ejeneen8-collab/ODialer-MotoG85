
name: Build ODialer Moto G85

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses and install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Extract Android project
        run: |
          mkdir -p /tmp/odialer-src
          unzip -q ODialer-MotoG85-starter.zip -d /tmp/odialer-src
          cp -a /tmp/odialer-src/ODialer-MotoG85/. .

      - name: Add Contacts permission
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"

          tree = ET.parse(path)
          root = tree.getroot()

          permission = "android.permission.READ_CONTACTS"
          if not any(
              item.get(ns + "name") == permission
              for item in root.findall("uses-permission")
          ):
              ET.SubElement(root, "uses-permission", {ns + "name": permission})

          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Create new Dialer interface
        run: |
          cat > app/src/main/java/com/motog85/odialer/MainActivity.kt <<'EOF'
          package com.motog85.odialer

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.ContactsContract
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {

              private val savedContacts =
                  mutableStateListOf<Pair<String, String>>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS)
                      == PackageManager.PERMISSION_GRANTED) {
                      loadContacts()
                  } else {
                      requestPermissions(
                          arrayOf(Manifest.permission.READ_CONTACTS), 101
                      )
                  }

                  setContent {
                      var number by remember { mutableStateOf("") }

                      val keys = listOf(
                          listOf("1" to "", "2" to "ABC", "3" to "DEF"),
                          listOf("4" to "GHI", "5" to "JKL", "6" to "MNO"),
                          listOf("7" to "PQRS", "8" to "TUV", "9" to "WXYZ"),
                          listOf("*" to "", "0" to "+", "#" to "")
                      )

                      val lightGray = Color(0xFFF1F1F1)
                      val green = Color(0xFF00C967)

                      val search = number.filter { it.isDigit() }

                      val suggestions = if (search.isNotEmpty()) {
                          savedContacts.filter { contact ->
                              val phone = contact.second.filter { it.isDigit() }
                              phone.startsWith(search) ||
                                  contact.first.contains(number, ignoreCase = true)
                          }.take(5)
                      } else {
                          emptyList()
                      }

                      MaterialTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = Color.White
                          ) {
                              Column(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .padding(horizontal = 22.dp)
                              ) {
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .padding(top = 24.dp),
                                      horizontalArrangement =
                                          Arrangement.SpaceBetween,
                                      verticalAlignment =
                                          Alignment.CenterVertically
                                  ) {
                                      CircleAction("‹", lightGray) {
                                          number = ""
                                      }

                                      Row(
                                          verticalAlignment =
                                              Alignment.CenterVertically
                                      ) {
                                          CircleAction("⌕", lightGray) {
                                              try {
                                                  startActivity(
                                                      Intent(
                                                          Intent.ACTION_VIEW,
                                                          ContactsContract.Contacts.CONTENT_URI
                                                      )
                                                  )
                                              } catch (_: Exception) {}
                                          }

                                          Spacer(Modifier.width(12.dp))

                                          CircleAction("▦", lightGray) {
                                              number = ""
                                          }
                                      }
                                  }

                                  Box(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .weight(1f),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Text(
                                          text = number,
                                          fontSize = 30.sp,
                                          color = Color.Black,
                                          fontWeight = FontWeight.Medium,
                                          textAlign = TextAlign.Center
                                      )
                                  }

                                  if (suggestions.isNotEmpty()) {
                                      Text(
                                          "CONTACT SUGGESTIONS",
                                          modifier = Modifier.padding(
                                              start = 8.dp, bottom = 5.dp
                                          ),
                                          fontSize = 12.sp,
                                          color = Color.Gray,
                                          fontWeight = FontWeight.Bold
                                      )

                                      LazyColumn(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .heightIn(max = 125.dp)
                                      ) {
                                          items(suggestions) { contact ->
                                              Row(
                                                  modifier = Modifier
                                                      .fillMaxWidth()
                                                      .clickable {
                                                          number = contact.second
                                                      }
                                                      .padding(
                                                          horizontal = 8.dp,
                                                          vertical = 7.dp
                                                      ),
                                                  verticalAlignment =
                                                      Alignment.CenterVertically
                                              ) {
                                                  Box(
                                                      modifier = Modifier
                                                          .size(38.dp)
                                                          .clip(CircleShape)
                                                          .background(
                                                              Color(0xFFE8EEF8)
                                                          ),
                                                      contentAlignment =
                                                          Alignment.Center
                                                  ) {
                                                      Text(
                                                          contact.first
                                                              .take(1)
                                                              .uppercase(),
                                                          color = Color(0xFF315A91),
                                                          fontWeight =
                                                              FontWeight.Bold
                                                      )
                                                  }

                                                  Column(
                                                      modifier = Modifier
                                                          .weight(1f)
                                                          .padding(start = 12.dp)
                                                  ) {
                                                      Text(
                                                          contact.first,
                                                          color = Color.Black,
                                                          fontWeight =
                                                              FontWeight.SemiBold
                                                      )
                                                      Text(
                                                          contact.second,
                                                          color = Color.Gray,
                                                          fontSize = 13.sp
                                                      )
                                                  }
                                                  Text(
                                                      "›",
                                                      fontSize = 25.sp,
                                                      color = Color.Gray
                                                  )
                                              }
                                          }
                                      }
                                  }

                                  Column(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalAlignment =
                                          Alignment.CenterHorizontally
                                  ) {
                                      keys.forEach { row ->
                                          Row(
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .padding(vertical = 8.dp),
                                              horizontalArrangement =
                                                  Arrangement.SpaceEvenly
                                          ) {
                                              row.forEach { item ->
                                                  Column(
                                                      modifier = Modifier
                                                          .size(92.dp)
                                                          .clip(CircleShape)
                                                          .background(lightGray)
                                                          .clickable {
                                                              number += item.first
                                                          },
                                                      horizontalAlignment =
                                                          Alignment.CenterHorizontally,
                                                      verticalArrangement =
                                                          Arrangement.Center
                                                  ) {
                                                      Text(
                                                          item.first,
                                                          fontSize = 38.sp,
                                                          color = Color.Black,
                                                          fontWeight =
                                                              FontWeight.Medium
                                                      )

                                                      if (item.second.isNotEmpty()) {
                                                          Text(
                                                              item.second,
                                                              fontSize = 15.sp,
                                                              color = Color.DarkGray,
                                                              fontWeight =
                                                                  FontWeight.Bold
                                                          )
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  }

                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .padding(
                                              top = 12.dp,
                                              bottom = 30.dp
                                          ),
                                      horizontalArrangement =
                                          Arrangement.SpaceEvenly,
                                      verticalAlignment =
                                          Alignment.CenterVertically
                                  ) {
                                      BottomAction("WhatsApp") {
                                          if (number.isNotBlank()) {
                                              try {
                                                  startActivity(
                                                      Intent(
                                                          Intent.ACTION_VIEW,
                                                          Uri.parse(
                                                              "https://wa.me/${number.filter { it.isDigit() }}"
                                                          )
                                                      )
                                                  )
                                              } catch (_: Exception) {}
                                          }
                                      }

                                      Box(
                                          modifier = Modifier
                                              .size(112.dp)
                                              .clip(CircleShape)
                                              .background(green)
                                              .clickable {
                                                  if (number.isNotBlank()) {
                                                      startActivity(
                                                          Intent(
                                                              Intent.ACTION_DIAL,
                                                              Uri.parse("tel:$number")
                                                          )
                                                      )
                                                  }
                                              },
                                          contentAlignment =
                                              Alignment.Center
                                      ) {
                                          Column(
                                              horizontalAlignment =
                                                  Alignment.CenterHorizontally
                                          ) {
                                              Text(
                                                  "\u260E\uFE0E",
                                                  color = Color.White,
                                                  fontSize = 42.sp
                                              )
                                              Text(
                                                  "SIM 1",
                                                  color = Color.White,
                                                  fontSize = 12.sp,
                                                  fontWeight = FontWeight.Bold
                                              )
                                          }
                                      }

                                      BottomAction("⌫") {
                                          if (number.isNotEmpty()) {
                                              number = number.dropLast(1)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              private fun loadContacts() {
                  savedContacts.clear()

                  try {
                      val cursor = contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          arrayOf(
                              ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                              ContactsContract.CommonDataKinds.Phone.NUMBER
                          ),
                          null,
                          null,
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME +
                              " ASC"
                      )

                      cursor?.use {
                          val nameIndex = it.getColumnIndex(
                              ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME
                          )
                          val numberIndex = it.getColumnIndex(
                              ContactsContract.CommonDataKinds.Phone.NUMBER
                          )

                          while (it.moveToNext()) {
                              val name = it.getString(nameIndex) ?: ""
                              val phone = it.getString(numberIndex) ?: ""

                              if (name.isNotBlank() && phone.isNotBlank()) {
                                  savedContacts.add(name to phone)
                              }
                          }
                      }
                  } catch (_: Exception) {}
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(
                      requestCode, permissions, grantResults
                  )

                  if (requestCode == 101 &&
                      grantResults.isNotEmpty() &&
                      grantResults[0] == PackageManager.PERMISSION_GRANTED
                  ) {
                      loadContacts()
                  }
              }
          }

          @Composable
          fun CircleAction(
              symbol: String,
              color: Color,
              onClick: () -> Unit
          ) {
              Box(
                  modifier = Modifier
                      .size(56.dp)
                      .clip(CircleShape)
                      .background(color)
                      .clickable { onClick() },
                  contentAlignment = Alignment.Center
              ) {
                  Text(
                      symbol,
                      fontSize = 30.sp,
                      color = Color.DarkGray
                  )
              }
          }

          @Composable
          fun BottomAction(
              label: String,
              onClick: () -> Unit
          ) {
              Box(
                  modifier = Modifier
                      .size(64.dp)
                      .clip(CircleShape)
                      .clickable { onClick() },
                  contentAlignment = Alignment.Center
              ) {
                  Text(
                      label,
                      fontSize = if (label == "⌫") 32.sp else 13.sp,
                      color = Color.Black,
                      fontWeight = FontWeight.Bold,
                      textAlign = TextAlign.Center
                  )
              }
          }
          EOF

      - name: Set Java and Kotlin target to 17
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ODialer-MotoG85-APK
          path: app/build/outputs/apk/debug/app-debug.apk
